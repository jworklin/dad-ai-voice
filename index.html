<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>爸爸的 AI 語音助手 V0.2</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#101827;color:white;margin:0;padding:24px;text-align:center}h1{font-size:29px}#status{font-size:27px;margin:25px 0;min-height:75px}button{font-size:25px;font-weight:bold;border:0;border-radius:22px;padding:22px;width:100%;margin:9px 0;background:#70d7af;color:#101827}button.stop{background:#ffc1b8}#heard,#reply,#log{background:#263448;border-radius:15px;padding:15px;text-align:left;margin:16px 0;word-break:break-word}#log{font-size:14px;color:#d2d9e5;white-space:pre-wrap}small{color:#d2d9e5}label{display:block;margin:12px}</style></head><body><h1>爸爸的 AI 語音助手</h1><small>V0.2 · 語音功能測試，尚未連接 GPT 或聲音複製</small><div id="status" role="status">尚未開始</div><button id="start">開始聊天</button><button id="stop" class="stop">停止聊天</button><div id="heard">爸爸說：—</div><div id="reply">回答：—</div><div id="log">診斷資訊：等待測試</div><script>
const statusEl=document.getElementById('status'), logEl=document.getElementById('log');let active=false,recognition=null,speaking=false,restartTimer=null,session=0;
function log(s){logEl.textContent=new Date().toLocaleTimeString()+' '+s+'\n'+logEl.textContent.slice(0,1700)}
function status(s){statusEl.textContent=s;log(s)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
log('網址協定：'+location.protocol+'；安全環境：'+window.isSecureContext+'；語音辨識：'+!!SR+'；語音合成：'+!!window.speechSynthesis);
function listen(){if(!active||speaking||!SR||recognition)return;let mySession=session;try{const r=new SR();recognition=r;r.lang='zh-TW';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;let finalText='',handled=false;r.onstart=()=>{if(active&&mySession===session)status('正在聆聽，請說話')};r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;document.getElementById('heard').textContent='爸爸說：'+t;if(e.results[i].isFinal){finalText=t;handled=true}}if(handled){r.stop();}};r.onerror=e=>{log('辨識錯誤：'+e.error);if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){active=false;status('無法使用麥克風：'+e.error)}else if(e.error==='network'){active=false;status('語音服務網路錯誤，請檢查連線')}};r.onend=()=>{if(recognition===r)recognition=null;if(mySession!==session||!active)return;if(finalText){answer(finalText)}else{restartTimer=setTimeout(listen,800)}};r.start()}catch(e){recognition=null;status('啟動失敗：'+e.message)}}
function answer(t){if(!active)return;speaking=true;let reply='我聽到你說：'+t+'。這是語音測試，目前還沒有連接人工智慧。';document.getElementById('reply').textContent='回答：'+reply;status('正在回答');if(!('speechSynthesis' in window)){speaking=false;status('手機不支援語音播放');return}const u=new SpeechSynthesisUtterance(reply);u.lang='zh-TW';u.rate=.88;u.volume=1;u.onend=()=>{speaking=false;if(active){status('回答完成，繼續聆聽');restartTimer=setTimeout(listen,500)}};u.onerror=e=>{speaking=false;log('播放錯誤：'+e.error);if(active)restartTimer=setTimeout(listen,800)};speechSynthesis.cancel();speechSynthesis.speak(u)}
document.getElementById('start').onclick=()=>{if(!SR){status('此瀏覽器不支援網頁語音辨識，請改用最新版 Chrome');return}if(location.protocol==='file:'){status('目前從下載檔案開啟，請改用 HTTPS 網址測試');return}if(!window.isSecureContext){status('需要 HTTPS 安全網址才能使用麥克風');return}active=true;session++;clearTimeout(restartTimer);if(recognition){try{recognition.abort()}catch(e){}recognition=null}speechSynthesis?.cancel();speaking=false;status('準備啟動麥克風');listen()};
document.getElementById('stop').onclick=()=>{active=false;session++;clearTimeout(restartTimer);try{recognition?.abort()}catch(e){}recognition=null;speechSynthesis?.cancel();speaking=false;status('已停止聊天')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)log('網頁進入背景，Android 可能暫停麥克風')});
</script></body></html>
